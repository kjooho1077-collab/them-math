<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#d1fae5"> 
    <title>더엠수학학원 | 관리자 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-style: normal !important; } /* 이탤릭 방지 */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #d1fae5; 
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
  
        .animated-bg {
            min-height: 100dvh; 
            background: linear-gradient(-45deg, #a7f3d0, #d1fae5, #ecfdf5, #a7f3d0);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
  
        input:focus { font-size: 16px !important; } 
    </style>
</head>
<body>
    
    <div class="animated-bg relative">
        <div class="absolute inset-0 bg-white/10 backdrop-blur-[1px]"></div>
  
        <div class="w-full max-w-md p-6 relative z-10 flex flex-col items-center">
            <div class="text-center mb-6">
                <h1 class="text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">더엠<span class="text-blue-600">수학</span></h1>
            </div>
  
            <div class="mb-10 text-center">
                <p class="text-slate-600 text-lg font-medium leading-relaxed">안녕하세요<br>더엠수학학원입니다.</p>
            </div>
  
            <div class="w-full bg-white/95 backdrop-blur-md p-8 rounded-[2.5rem] shadow-2xl shadow-emerald-900/10 border border-white">
                <form id="login-form" onsubmit="return false;">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1 text-left w-full">아이디</label>
                            <input type="text" id="user-id" placeholder="아이디를 입력하세요" 
                                class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all text-base bg-white shadow-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1 text-left w-full">비밀번호</label>
                            <div class="relative">
                                <input type="password" id="password_input" placeholder="••••••••" 
                                    class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all text-base pr-12 bg-white shadow-sm">
                                <button type="button" id="toggle_password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400">
                                    <i class="fa-regular fa-eye-slash text-lg" id="eye_icon"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <p id="error-msg" class="text-rose-500 text-xs mt-4 text-center hidden font-bold underline">아이디 또는 비밀번호가 틀렸습니다.</p>
  
                    <button type="submit" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition-all shadow-lg text-base tracking-wide active:scale-[0.98]">
                        로그인하기
                    </button>
                </form>
  
                <div class="mt-8 text-center">
                    <a href="#" class="text-sm text-slate-400 font-medium border-b border-slate-200 pb-0.5">비밀번호를 잊으셨나요?</a>
                </div>
            </div>
  
            <p class="text-center text-slate-400 text-[10px] mt-12 uppercase tracking-[0.2em] font-medium">
                &copy; 2026 THE M MATH. All rights reserved.
            </p>
        </div>
    </div>
  
    <script>
        const loginForm = document.getElementById('login-form');
        const idInput = document.getElementById('user-id');
        const passwordInput = document.getElementById('password_input');
        const errorMsg = document.getElementById('error-msg');
        const togglePasswordButton = document.getElementById('toggle_password');
        const eyeIcon = document.getElementById('eye_icon');
  
        // 1. 비밀번호 보이기/숨기기 토글
        togglePasswordButton.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye-slash');
            eyeIcon.classList.toggle('fa-eye');
        });

        // 2. 로그인 실제 로직 (경로 연결)
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const id = idInput.value;
            const pw = passwordInput.value;

            // 원장님 아이디 체크
            if (id === 'admin' && pw === '1234') {
                // 성공 시 users 폴더 안의 admin_main.html로 이동!
                location.href = 'users/admin_main.html';
            } else {
                // 실패 시 에러 메시지 노출
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
