<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ecfdf5"> 
    <title>더엠수학 | 모바일 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0fdf4; overflow-x: hidden; }
        
        /* 모바일 슬라이드 메뉴 스타일 */
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%); /* 처음에 숨김 */
        }
        #mobile-menu.open {
            transform: translateX(0); /* 열림 */
        }
        
        /* 카드형 메뉴 텍스트 줄바꿈 방지 및 중앙 정렬 */
        .card-text {
            word-break: keep-all;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body class="safe-area">

    <header class="sticky top-0 z-50 bg-white border-b border-emerald-100 px-4 h-16 flex items-center justify-between shadow-sm">
        <h1 class="text-xl font-bold flex items-center gap-1 text-emerald-700">
            <i class="fa-solid fa-square-root-variable text-emerald-500"></i> 더엠수학
        </h1>
        <div class="flex items-center gap-2">
            <button title="비밀번호 변경" class="text-emerald-500 hover:text-emerald-700 p-2"><i class="fa-solid fa-key text-lg"></i></button>
            <button title="로그아웃" class="text-emerald-400 hover:text-rose-500 p-2"><i class="fa-solid fa-power-off text-lg"></i></button>
            <button id="menu-open-btn" class="text-emerald-700 hover:text-emerald-900 p-2 ml-1">
                <i class="fa-solid fa-bars text-2xl"></i>
            </button>
        </div>
    </header>

    <div id="mobile-menu-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>
    <aside id="mobile-menu" class="fixed top-0 right-0 h-screen w-[280px] bg-white z-50 shadow-2xl flex flex-col border-l border-emerald-100">
        <div class="p-6 border-b border-emerald-100 flex items-center justify-between bg-emerald-50">
            <h2 class="text-lg font-bold text-emerald-800">전체 메뉴</h2>
            <button id="menu-close-btn" class="text-emerald-400 hover:text-emerald-700"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 bg-emerald-100 text-emerald-800 rounded-xl font-bold">
                <i class="fa-solid fa-house w-5 text-center"></i> 홈
            </a>
            
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">
                <i class="fa-solid fa-user-group w-5 text-center text-emerald-600"></i> 학생현황
            </a>
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">
                <i class="fa-solid fa-layer-group w-5 text-center text-emerald-600"></i> 반현황
            </a>
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">
                <i class="fa-solid fa-book-open w-5 text-center text-emerald-600"></i> 숙제현황
            </a>
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all text-orange-600 font-medium">
                <i class="fa-solid fa-star w-5 text-center"></i> 굿티커현황
            </a>
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">

            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">

            </a>
            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">
                <i class="fa-solid fa-bullhorn w-5 text-center text-emerald-600"></i> 공지사항

            <a href="#" class="flex items-center gap-3.5 px-4 py-3 hover:bg-emerald-50 rounded-xl transition-all">

            </a>

            </a>
        </nav>

        <div class="p-4 border-t border-emerald-100 bg-emerald-50/50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white font-bold shadow-inner">관</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-emerald-900 truncate">관리자님</p>
                    <p class="text-[10px] text-emerald-600
