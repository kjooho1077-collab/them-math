<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학학원 | 관리자 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">THE <span class="text-blue-600">M</span></h1>
            <p class="text-slate-500 mt-2 font-medium">수학학원 관리 시스템</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6 text-center">관리자 로그인</h2>
            
            <form onsubmit="return false;">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">아이디</label>
                        <input type="text" placeholder="아이디를 입력하세요" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">비밀번호</label>
                        <div class="relative">
                            <input type="password" id="password_input" placeholder="••••••••" 
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm pr-12">
                            <button type="button" id="toggle_password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
                                <i class="fa-regular fa-eye-slash" id="eye_icon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button class="w-full mt-8 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg text-sm">
                    로그인하기
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="#" class="text-sm text-slate-400 hover:text-slate-600 transition-colors">비밀번호를 잊으셨나요?</a>
            </div>
        </div>

        <p class="text-center text-slate-400 text-xs mt-10">
            &copy; 2026 더엠수학학원. All rights reserved.
        </p>
    </div>

    <script>
        const passwordInput = document.getElementById('password_input');
        const togglePasswordButton = document.getElementById('toggle_password');
        const eyeIcon = document.getElementById('eye_icon');

        togglePasswordButton.addEventListener('click', function () {
            // 현재 입력 타입 확인
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            if (type === 'text') {

                eyeIcon.classList.add('fa-eye');
