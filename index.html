<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학학원 | 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f7fee7; } /* 매우 연한 연녹색 배경 */
        .sidebar-item-active { background-color: #bef264; color: #166534; font-weight: 700; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 bg-emerald-50 text-emerald-900 flex-shrink-0 hidden md:flex flex-col border-r border-emerald-100 shadow-sm">
        <div class="p-6 border-b border-emerald-100">
            <h1 class="text-2xl font-black flex items-center gap-2 text-emerald-700">
                <i class="fa-solid fa-square-root-variable text-emerald-500"></i> 더엠수학
            </h1>
        </div>
        
        <nav class="flex-1 px-3 space-y-1 mt-4 overflow-y-auto">
            <a href="#" class="sidebar-item-active flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i class="fa-solid fa-house w-5 text-center"></i> 홈
            </a>
            
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-user-group w-5 text-center text-emerald-600"></i> 학생현황
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-layer-group w-5 text-center text-emerald-600"></i> 반현황
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-book-open w-5 text-center text-emerald-600"></i> 숙제현황
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all font-semibold text-orange-600">
                <i class="fa-solid fa-star w-5 text-center"></i> 굿티커현황
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-user-check w-5 text-center text-emerald-600"></i> 출결현황
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-clock-rotate-left w-5 text-center text-emerald-600"></i> 보강현황
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-bullhorn w-5 text-center text-emerald-600"></i> 공지사항
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-chart-line w-5 text-center text-emerald-600"></i> 학습리포트
            </a>

            <div class="pt-4 pb-2 text-[11px] font-bold text-emerald-400 px-4 uppercase tracking-widest">System Management</div>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-user-graduate w-5 text-center"></i> 학생관리
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-chalkboard-user w-5 text-center"></i> 반관리
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-user-tie w-5 text-center"></i> 선생님관리
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-emerald-100 rounded-xl transition-all">
                <i class="fa-solid fa-gear w-5 text-center"></i> 설정
            </a>
        </nav>

        <div class="p-4 border-t border-emerald-100 bg-emerald-100/30">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white font-bold">관</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-emerald-900 truncate">관리자님</p>
                    <p class="text-[10px] text-emerald-600">them-math.com</p>
                </div>
                <button title="로그아웃" class="text-emerald-400 hover:text-rose-500 transition-colors"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 bg-white border-b border-emerald-100 flex items-center justify-between px-8 sticky top-0 z-20">
            <div class="flex items-center gap-2">
                <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">2026년 4월 7일 (화)</span>
            </div>
            <div class="flex items-center gap-4">
                <button class="text-slate-500 hover:text-emerald-600 text-sm font-medium transition-all"><i class="fa-solid fa-key mr-1"></i>비밀번호 변경</button>
                <div class="w-px h-4 bg-slate-200"></div>
                <button class="text-slate-500 hover:text-rose-500 text-sm font-medium transition-all"><i class="fa-solid fa-right-from-bracket mr-1"></i>로그아웃</button>
            </div>
        </header>

        <div class="p-8 max-w-6xl mx-auto w-full">
            <div class="mb-10">
                <h2 class="text-3xl font-black text-slate-800">관리자님 안녕하세요! 👋</h2>
                <p class="text-emerald-600 mt-2 font-medium">"오늘도 아이들의 성장을 위해 함께합니다."</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                
                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center text-emerald-600 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-user-group text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">학생현황</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">4명</h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-layer-group text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">반현황</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">15개</h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border-2 border-emerald-400 bg-emerald-50/20 hover:shadow-xl transition-all text-left">
                    <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-emerald-600 mb-4 shadow-sm group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-book-open text-xl"></i>
                    </div>
                    <p class="text-sm text-emerald-700 font-bold uppercase tracking-tight">숙제현황</p>
                    <h3 class="text-xl font-black text-slate-800 mt-1 flex items-baseline gap-1">완료 3 <span class="text-rose-500 font-bold text-sm ml-1">미완 1</span></h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-500 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-star text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">굿티커현황</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">128개</h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-teal-50 rounded-2xl flex items-center justify-center text-teal-600 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-user-check text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">출결현황</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">0/4</h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-rose-50 rounded-2xl flex items-center justify-center text-rose-600 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-clock-rotate-left text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">보강현황</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">2건</h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-bullhorn text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">공지사항</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">5건</h3>
                </button>

                <button class="group bg-white p-6 rounded-3xl shadow-sm border border-emerald-50 hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-900/5 transition-all text-left">
                    <div class="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-chart-line text-xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-bold uppercase tracking-tight">학습리포트</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1">분석 완료</h3>
                </button>

            </div>
        </div>
    </main>

</body>
</html>
