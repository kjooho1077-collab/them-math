<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더엠수학학원 | 학생 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 테이블 스타일 */
        th, td { text-align: center; vertical-align: middle; border-bottom: 1px solid #f1f5f9; }
        th { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; padding: 12px 16px; font-weight: 700; }
        td { font-size: 13px; padding: 16px; color: #334155; }
        
        /* 토글 스위치 스타일 */
        .toggle-switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <aside class="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-slate-100 flex flex-col flex-shrink-0 z-50">
        <div class="p-4 md:p-6 flex items-center justify-between">
            <h1 class="text-xl md:text-2xl font-black text-emerald-600 flex items-center gap-2">
                <i class="fa-solid fa-square-root-variable"></i> 더엠수학
            </h1>
            <div class="md:hidden">
                <button id="mobile-menu-btn" class="text-slate-400 p-2"><i class="fa-solid fa-bars text-xl"></i></button>
            </div>
        </div>
        
        <nav id="nav-menu" class="hidden md:flex flex-1 flex-col p-4 space-y-0.5 overflow-y-auto no-scrollbar">
            <div class="pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-[0.2em]">Dashboard</div>
            <a href="index.html" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-house w-5 text-center"></i> Home</a>
            
            <div class="space-y-0.5">
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-group w-5 text-center"></i> 학생현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-chart-line w-5 text-center"></i> 학습리포트</a>
            </div>

            <div class="pt-6 pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-[0.2em]">Management</div>
            <div class="space-y-0.5">
                <a href="#" class="flex items-center gap-3 px-4 py-2 bg-emerald-50 text-emerald-700 rounded-xl font-bold italic text-sm">
                    <i class="fa-solid fa-user-graduate w-5 text-center"></i> 학생관리
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-chalkboard-user w-5 text-center"></i> 반관리</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-gear w-5 text-center"></i> 선생님관리</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-gear w-5 text-center"></i> 설정</a>
            </div>
        </nav>

        <div class="p-4 border-t border-slate-50">
            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl relative">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white font-bold shadow-sm flex-shrink-0">원</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-black text-slate-800 truncate">김주호 <span class="font-medium text-[11px] text-slate-500">원장님</span></p>
                    <button class="text-[10px] text-rose-500 font-bold hover:underline">로그아웃</button>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc] overflow-y-auto">
        <header class="hidden md:flex h-14 bg-white border-b border-slate-50 items-center justify-between px-8 flex-shrink-0">
            <div class="text-slate-300 text-[10px] font-medium italic tracking-widest uppercase">THE M MATH MANAGEMENT SYSTEM</div>
            <div class="flex items-center gap-5 text-[11px] font-bold text-slate-400">
                <span>관리자 원장님</span>
                <button class="hover:text-emerald-600 flex items-center gap-1.5"><i class="fa-solid fa-key"></i> 비밀번호변경</button>
                <button class="hover:text-rose-500 flex items-center gap-1.5"><i class="fa-solid fa-power-off"></i> 로그아웃</button>
            </div>
        </header>

        <div class="p-6 md:p-10 w-full mx-auto max-w-7xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">학생 관리</h2>
                <button class="bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm hover:bg-emerald-600 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 학생 추가
                </button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 flex items-center gap-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" placeholder="학생 이름, 연락처, 반으로 검색" class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <select class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none text-slate-600">
                    <option>전체 반</option>
                </select>
                <select class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none text-slate-600">
                    <option>전체 상태</option>
                </select>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-slate-50/50">
                                <th class="w-12">#</th>
                                <th class="text-left">이름</th>
                                <th>학년</th>
                                <th>학교</th>
                                <th>반</th>
                                <th>연락처</th>
                                <th>상태</th>
                                <th>알림</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="hover:bg-slate-50 transition-colors">
                                <td class="text-slate-400">1</td>
                                <td class="text-left font-bold text-slate-800">김학생</td>
                                <td>초6</td>
                                <td>더엠초</td>
                                <td><span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg font-bold text-[11px]">반A</span></td>
                                <td class="text-slate-500">010-1234-5678</td>
                                <td><span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg font-bold text-[11px]">재원</span></td>
                                <td>
                                    <label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label>
                                </td>
                                <td>
                                    <div class="flex justify-center gap-1.5">
                                        <button class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-emerald-50 hover:text-emerald-600"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-rose-50 hover:text-rose-600"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition-colors">
                                <td class="text-slate-400">2</td>
                                <td class="text-left font-bold text-slate-800">이학생</td>
                                <td>중1</td>
                                <td>더엠중</td>
                                <td><span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg font-bold text-[11px]">반B</span></td>
                                <td class="text-slate-500">010-9876-5432</td>
                                <td><span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-bold text-[11px]">휴원</span></td>
                                <td>
                                    <label class="toggle-switch"><input type="checkbox"><span class="slider"></span></label>
                                </td>
                                <td>
                                    <div class="flex justify-center gap-1.5">
                                        <button class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-emerald-50 hover:text-emerald-600"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-rose-50 hover:text-rose-600"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('nav-menu');
        btn.addEventListener('click', () => { menu.classList.toggle('hidden'); });
    </script>
</body>
</html>
