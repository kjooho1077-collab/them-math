<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#d1fae5"> 
    <title>더엠수학학원 | 관리자 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 모바일에서 스크롤 튕김 방지 및 전체 화면 고정 */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Noto Sans KR', sans-serif; 
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-bg {
            width: 100%;
            height: 100%;
            /* 모바일 하단 바까지 꽉 채우도록 고정 */
            background: linear-gradient(-45deg, #a7f3d0, #d1fae5, #ecfdf5, #a7f3d0);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 아이폰/안드로이드 주소창 대응 */
        .safe-area {
            min-height: 100dvh; 
        }
    </style>
</head>
<body>
    
    <div class="animated-bg safe-area relative">
        <div class="absolute inset-0 bg-white/10 backdrop-blur-[1px]"></div>

        <div class="w-full max-w-md p-6 relative z-10 flex flex-col items-center">
            <div class="text-center mb-6">
                <h1 class="text-5xl font-extrabold text-slate-900 tracking-tight">더엠<span class="text-blue-600">수학</span></h1>
            </div>

            <div class="mb-10">
                <p class="text-slate-600 text-lg font-medium">안녕하세요 더엠수학학원입니다.</p>
            </div>

            <div class="w-full bg-white/90 backdrop-blur-md p-8 rounded-[2rem] shadow-2xl shadow-emerald-900/10 border border-white">
                <form onsubmit="return false;">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">아이디</label>
                            <input type="text" placeholder="아이디를 입력하세요" 
                                class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all text-sm bg-white/50">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5 ml-1">비밀번호</label>
                            <div class="relative">
                                <input type="password" id="password_input" placeholder="••••••••" 
                                    class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all text-sm pr-12 bg-white/50">
                                <button type="button" id="toggle_password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400">
                                    <i class="fa-regular fa-eye-slash" id="eye_icon"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button class="w-full mt-10 bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition-all shadow-lg text-sm tracking-wide">
                        로그인하기
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="#" class="text-sm text-slate-400 font-medium">비밀번호를 잊으셨나요?</a>
                </div>
            </div>

            <p class="text-center text-slate-400 text-[10px] mt-12 uppercase tracking-widest">
                &copy; 2026 THE M MATH. All rights reserved.
            </p>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password_input');
        const togglePasswordButton = document.getElementById('toggle_password');
        const eyeIcon = document.getElementById('eye_icon');

        togglePasswordButton.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });
    </script>

</body>
</html>
