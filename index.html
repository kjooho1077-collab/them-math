<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학 관리 시스템</title>
    
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; overflow: hidden; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar { width: 260px; height: 100vh; background: white; border-right: 1px solid #f1f5f9; flex-shrink: 0; }
        .main-content { flex: 1; height: 100vh; overflow-y: auto; }
    </style>
</head>
<body class="flex">

    <div id="login-page" class="absolute inset-0 bg-[#e3f7f2] flex flex-col items-center justify-center z-50">
        <h1 class="text-4xl font-black text-emerald-600 mb-8 tracking-tight">더엠수학</h1>
        
        <div class="bg-white p-12 rounded-3xl shadow-xl w-[400px] text-center border border-slate-100">
            <p class="text-slate-500 mb-10 text-base font-bold whitespace-nowrap">안녕하세요. 더엠수학학원입니다.</p>
            
            <form id="login-form" class="space-y-6 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">아이디</label>
                    <input type="text" placeholder="아이디를 입력하세요" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-sm focus:ring-1 ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">비밀번호</label>
                    <input type="password" placeholder="비밀번호를 입력하세요" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-sm focus:ring-1 ring-emerald-500">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white p-4 rounded-xl text-sm font-black tracking-wide shadow-lg hover:bg-slate-800 transition">로그인하기</button>
            </form>
        </div>
    </div>

    <aside class="sidebar flex flex-col">
        <div class="p-6 text-2xl font-black text-emerald-600 tracking-tight">더엠수학</div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto no-scrollbar">
            <div class="text-[10px] font-bold text-slate-300 px-4 mb-2 uppercase tracking-widest">Dashboard</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm"><i class="fa-solid fa-house"></i> 대시보드</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-bold"><i class="fa-solid fa-user-graduate"></i> 학생관리</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-rose-500 hover:bg-rose-50 rounded-xl text-sm font-bold"><i class="fa-solid fa-clock-rotate-left"></i> 누적지각관리</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-amber-600 hover:bg-amber-50 rounded-xl text-sm font-bold"><i class="fa-solid fa-star"></i> 굿티커 가챠센터</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="h-14 bg-white border-b border-slate-50 flex items-center px-8 text-[10px] font-bold text-slate-300 tracking-widest uppercase">
            THE M MATH MANAGEMENT SYSTEM
        </header>
        <div id="main-display" class="p-8">
            <h2 class="text-3xl font-black text-slate-800">안녕하세요, 원장님! 👋</h2>
            <p class="text-slate-400 mt-2">좌측 메뉴를 선택해 주세요.</p>
        </div>
    </main>

    <script>
        const loginPage = document.getElementById('login-page');
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            loginPage.style.display = 'none';
        });
    </script>
</body>
</html>
