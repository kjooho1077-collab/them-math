<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학 | 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <img src="logo.png" alt="Logo" class="w-20 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-slate-800">더엠수학 관리시스템</h2>
            <p class="text-slate-400">사용자 계정으로 로그인하세요.</p>
        </div>

        <form id="login-form" class="space-y-4">
            <input type="text" id="user-id" placeholder="아이디" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <input type="password" id="pw-input" placeholder="비밀번호" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold hover:bg-emerald-600 transition">로그인</button>
        </form>
        <p id="error-msg" class="text-rose-500 text-sm mt-4 text-center hidden">아이디 또는 비밀번호가 틀렸습니다.</p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const pw = document.getElementById('pw-input').value;

            // [핵심 수정 부분] 폴더 경로를 명확히 지정해줍니다.
            if (id === 'admin' && pw === '1234') {
                location.href = 'users/admin_main.html'; // 앞에 users/ 를 꼭 붙여야 합니다!
            } else if (id === 'teacher' && pw === '1234') {
                location.href = 'users/teacher_main.html';
            } else if (id === 'student' && pw === '1234') {
                location.href = 'users/student_main.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
