<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더엠수학학원 | 학생 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* 스위치 스타일 */
        .toggle-checkbox:checked { right: 0; border-color: #10b981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-50">
        <div class="p-6 flex items-center justify-between">
            <h1 class="text-2xl font-black text-emerald-600 flex items-center gap-2">
                <i class="fa-solid fa-square-root-variable"></i> 더엠수학
            </h1>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl transition-all text-sm"><i class="fa-solid fa-house w-5 text-center"></i> 홈</a>
            <div class="pt-4 pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-[0.2em]">Management</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm">
                <i class="fa-solid fa-user-graduate w-5 text-center"></i> 학생관리
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl transition-all text-sm"><i class="fa-solid fa-chalkboard-user w-5 text-center"></i> 반관리</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl transition-all text-sm"><i class="fa-solid fa-gear w-5 text-center"></i> 설정</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 class="text-lg font-bold text-slate-800">학생 관리</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm font-black text-slate-700">김주호 <span class="font-medium text-xs text-slate-500">원장님</span></span>
                <button class="bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-emerald-600 transition-all">
                    <i class="fa-solid fa-plus mr-1"></i> 학생 추가
                </button>
            </div>
        </header>

        <div class="p-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" placeholder="학생 이름, 연락처, 반으로 검색" class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                </div>
                <div class="flex gap-2">
                    <select class="bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none">
                        <option>전체 반</option>
                        <option>샘플반A</option>
                        <option>화목금E</option>
                    </select>
                    <select class="bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none">
                        <option>상태 전체</option>
                        <option>재원</option>
                        <option>퇴원</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-100">
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">이름</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">학년</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">학교</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">반</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">로그인 정보</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">알림</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">상태</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr class="hover:bg-slate-50/50 transition-colors">
                                <td class="px-6 py-4 text-sm font-bold text-slate-700">나안가</td>
                                <td class="px-6 py-4 text-sm text-slate-500">초3</td>
                                <td class="px-6 py-4 text-sm text-slate-500">발곡</td>
                                <td class="px-6 py-4"><span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-[11px] font-bold">샘플반A</span></td>
                                <td class="px-6 py-4 text-center">
                                    <div class="inline-flex items-center gap-2 text-[11px] text-slate-400 bg-slate-50 px-3 py-1 rounded-lg">
                                        <span>ID: 7573</span> <i class="fa-solid fa-copy cursor-pointer hover:text-emerald-500"></i>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" name="toggle" id="toggle1" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                        <label for="toggle1" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-300 cursor-pointer"></label>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <select class="text-[11px] font-bold border border-slate-200 rounded-lg px-2 py-1 focus:outline-none">
                                        <option selected>재원</option>
                                        <option>퇴원</option>
                                        <option>휴원</option>
                                    </select>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <div class="flex justify-center gap-2">
                                        <button class="w-8 h-8 rounded-lg bg-slate-50 text-slate-400 hover:bg-emerald-50 hover:text-emerald-500 transition-all"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button class="w-8 h-8 rounded-lg bg-slate-50 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50/50 transition-colors">
                                <td class="px-6 py-4 text-sm font-bold text-slate-700">수학짱</td>
                                <td class="px-6 py-4 text-sm text-slate-500">중2</td>
                                <td class="px-6 py-4 text-sm text-slate-500">발곡</td>
                                <td class="px-6 py-4"><span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[11px] font-bold">샘플반B</span></td>
                                <td class="px-6 py-4 text-center">
                                    <div class="inline-flex items-center gap-2 text-[11px] text-slate-400 bg-slate-50 px-3 py-1 rounded-lg">
                                        <span>ID: 3333</span> <i class="fa-solid fa-copy cursor-pointer hover:text-emerald-500"></i>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" name="toggle" id="toggle2" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                        <label for="toggle2" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-300 cursor-pointer"></label>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <select class="text-[11px] font-bold border border-slate-200 rounded-lg px-2 py-1 focus:outline-none">
                                        <option selected>재원</option>
                                        <option>퇴원</option>
                                    </select>
                                </td>
                                <td class="px-6 py-4 text-center">
                                    <div class="flex justify-center gap-2">
                                        <button class="w-8 h-8 rounded-lg bg-slate-50 text-slate-400 hover:bg-emerald-50 hover:text-emerald-500 transition-all"><i class="fa-solid fa-pen text-xs"></i></button>
                                        <button class="w-8 h-8 rounded-lg bg-slate-50 text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-4 bg-slate-50/50 flex justify-center border-t border-slate-100">
                    <nav class="flex gap-1">
                        <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-slate-200 text-slate-400 hover:border-emerald-500 hover:text-emerald-500 transition-all text-xs font-bold shadow-sm">1</button>
                        <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-slate-200 text-slate-400 hover:border-emerald-500 hover:text-emerald-500 transition-all text-xs font-bold shadow-sm">2</button>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
