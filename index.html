<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학 관리 시스템</title>
    
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 기본 서체 및 배경 고정 */
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; flex-shrink: 0; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 40px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="p-6 text-2xl font-black text-emerald-600 italic tracking-tighter">
            <i class="fa-solid fa-square-root-variable"></i> THE M MATH
        </div>
        
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto no-scrollbar">
            <div class="text-[10px] font-bold text-slate-300 px-4 mb-2 uppercase italic tracking-widest">Dashboard</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm">
                <i class="fa-solid fa-house w-5"></i> 대시보드
            </a>
            
            <div class="pt-6 text-[10px] font-bold text-slate-300 px-4 mb-2 uppercase italic tracking-widest">Management</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-user-graduate w-5"></i> 학생관리
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-rose-500 hover:bg-rose-50 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-clock-rotate-left w-5"></i> 누적지각관리
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-amber-600 hover:bg-amber-50 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-star w-5"></i> 굿티커 가챠센터
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-bold">
                <i class="fa-solid fa-book w-5"></i> 수업일지 작성
            </a>
        </nav>

        <div class="p-4 border-t border-slate-50">
            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white font-bold">원</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-black text-slate-800">김주호 <span class="font-normal text-[11px]">원장님</span></p>
                </div>
            </div>
        </div>
    </aside>

    <div class="main-content">
        <header class="h-14 bg-white border-b border-slate-50 flex items-center px-8 text-[10px] font-bold text-slate-300 tracking-widest italic">
            THE M MATH MANAGEMENT SYSTEM
        </header>

        <div id="main-display" class="content-scroll">
            <h2 class="text-3xl font-black text-slate-800">안녕하세요, 원장님! 👋</h2>
            <p class="text-slate-400 mt-2">오늘도 더엠수학의 성장을 응원합니다. 좌측 메뉴를 선택해 주세요.</p>
        </div>
    </div>

</body>
</html>
