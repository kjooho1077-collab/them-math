<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학 관리 시스템</title>
    
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* [고정] 전체 서체 및 스크롤바 설정 */
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* [고정] 사이드바 및 레이아웃 구조 */
        .sidebar { width: 260px; height: 100vh; background: white; border-right: 1px solid #f1f5f9; flex-shrink: 0; }
        .main-content { flex: 1; height: 100vh; overflow-y: auto; }
    </style>
</head>
<body class="flex">

    <div id="login-page" class="absolute inset-0 bg-[#e3f7f2] flex flex-col items-center justify-center z-50">
        <h1 class="text-4xl font-black text-emerald-600 mb-8 italic tracking-tighter">THE M MATH</h1>
        
        <div class="bg-white p-12 rounded-3xl shadow-xl w-[400px] text-center border border-slate-100">
            <p class="text-slate-500 mb-10 text-base font-bold whitespace-nowrap">안녕하세요. 더엠수학학원입니다.</p>
            
            <form id="login-form" class="space-y-6 text-left">
                <div class="relative">
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">아이디</label>
                    <input type="text" placeholder="아이디를 입력하세요" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl focus:ring-1 ring-emerald-500 outline-none text-sm">
                </div>
                <div class="relative">
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">비밀번호</label>
                    <input type="password" placeholder="비밀번호를 입력하세요" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-xl focus:ring-1 ring-emerald-500 outline-none text-sm">
                </div>
                
                <button type="submit" class="w-full bg-slate-900 text-white p-3.5 rounded-xl text-sm font-black tracking-wide shadow-lg shadow-slate-200 hover:bg-slate-800 transition">로그인하기</button>
            </form>
            
            <button class="mt-6 text-xs text-slate-400 hover:text-rose-500 hover:underline">비밀번호를 잊으셨나요?</button>
        </div>
        
        <div class="absolute bottom-8 text-[11px] font-medium text-slate-400">© 2026 THE M MATH. ALL RIGHTS RESERVED.</div>
    </div>

    <aside class="sidebar flex flex-col">
        <div class="p-6 text-2xl font-black text-emerald-600 italic tracking-tighter">THE M MATH</div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto no-scrollbar">
            <div class="text-[10px] font-bold text-slate-300 px-4 mb-2 uppercase italic tracking-widest">Dashboard</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm"><i class="fa-solid fa-house"></i> 대시보드</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-check"></i> 출결현황</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-rose-500 hover:bg-rose-50 rounded-xl text-sm font-bold"><i class="fa-solid fa-clock-rotate-left"></i> 누적지각관리</a>
            
            <div class="pt-6 text-[10px] font-bold text-slate-300 px-4 mb-2 uppercase italic tracking-widest">Management</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl text-sm font-bold"><i class="fa-solid fa-user-graduate"></i> 학생관리</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-amber-600 hover:bg-amber-50 rounded-xl text-sm font-bold"><i class="fa-solid fa-star"></i> 굿티커 가챠센터</a>
            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-book-open"></i> 수업일지 작성</a>
        </nav>
    </aside>

    <main id="content-area" class="main-content">
        <header class="h-14 bg-white border-b border-slate-50 flex items-center px-8 text-[10px] font-bold text-slate-300 tracking-widest uppercase italic">
            THE M MATH MANAGEMENT SYSTEM
        </header>
        
        <div class="p-8">
            <h2 class="text-3xl font-black text-slate-800">안녕하세요, 원장님! 👋</h2>
            <p class="text-slate-400 mt-2">오늘도 더엠수학의 성장을 응원합니다. 좌측 메뉴를 선택해 주세요.</p>
        </div>
    </main>

    <script>
        const loginPage = document.getElementById('login-page');
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // 로그인 버튼을 누르면 로그인 화면을 가림
            loginPage.style.display = 'none';
        });
    </script>

</body>
</html>
