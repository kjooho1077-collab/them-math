<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더엠수학학원 | 관리자 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
        
        /* 움직이는 그라데이션 배경 애니메이션 */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-bg {
            /* 옅은 녹색과 에메랄드 톤의 역동적인 그라데이션 */
            background: linear-gradient(-45deg, #a7f3d0, #d1fae5, #ecfdf5, #a7f3d0);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }

        /* 입력창 스타일 */
        input::placeholder { font-size: 0.875rem; color: #a1a1aa; }
    </style>
</head>
<body class="animated-bg flex items-center justify-center min-h-screen relative">
    
    <div class="absolute inset-0 bg-white/10 backdrop-blur-[2px]"></div>

    <div class="w-full max-w-md p-8 relative z-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">더엠<span class="text-blue-600">수학</span></h1>
            <p class="text-slate-500 mt-2 font-medium">수학학원 관리 시스템</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-xl shadow-emerald-900/10 border border-emerald-100/50">
            
            <form onsubmit="return false;">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">아이디</label>
                        <input type="text" placeholder="아이디를 입력하세요" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition-all text-sm shadow-inner bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">비밀번호</label>
                        <div class="relative">
                            <input type="password" id="password_input" placeholder="••••••••" 
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition-all text-sm pr-12 shadow-inner bg-slate-50">
                            <button type="button" id="toggle_password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
                                <i class="fa-regular fa-eye-slash" id="eye_icon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button class="w-full mt-8 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg text-sm">
                    로그인하기
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="#" class="text-sm text-slate-400 hover:text-slate-600 transition-colors">비밀번호를 잊으셨나요?</a>
            </div>
        </div>

        <p class="text-center text-slate-400 text-xs mt-10">
            &copy; 2026 더엠수학학원. All rights reserved.
        </p>
    </div>

    <script>
        const passwordInput = document.getElementById('password_input');
        const togglePasswordButton = document.getElementById('toggle_password');
        const eyeIcon = document.getElementById('eye_icon');

        togglePasswordButton.addEventListener('click', function () {
            // 현재 입력 타입 확인
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // 아이콘 변경 (눈 뜨고/감고)
            if (type === 'text') {
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });
    </script>

</body>
</html>
