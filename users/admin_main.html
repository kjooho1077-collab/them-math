<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더엠수학학원 | 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #ffffff; color: #1e293b; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* [핵심] 카드 레이아웃 정렬 수정 */
        .stat-card-grid {
            display: grid;
            /* PC: 한 줄에 무조건 5개씩 배치 (줄을 맞추기 위함) */
            grid-template-columns: repeat(5, 180px); 
            gap: 20px;
            justify-content: start; /* 왼쪽 정렬로 변경 */
        }

        .fixed-card {
            width: 180px;
            height: 180px;
            background-color: white;
            border-radius: 2rem;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .fixed-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-color: #e2e8f0;
        }

        /* 모바일 대응: 한 줄에 2개씩 */
        @media (max-width: 1024px) {
            .stat-card-grid {
                grid-template-columns: repeat(auto-fill, 160px);
                justify-content: center;
            }
            .fixed-card {
                width: 160px;
                height: 160px;
            }
        }
    </style>
</head>

        </div>
        
        <nav class="flex-1 flex flex-col p-4 space-y-0.5 overflow-y-auto no-scrollbar">
            <div class="pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-[0.2em]">Dashboard</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2 bg-emerald-50 text-emerald-700 rounded-xl font-bold italic mb-2 text-sm">Home</a>
            <div class="space-y-0.5">
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-group w-5 text-center"></i> 학생현황</a>

                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-book-open w-5 text-center"></i> 숙제현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-star w-5 text-center"></i> 굿티커현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-check w-5 text-center"></i> 출결현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> 보강현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-calendar-check w-5 text-center"></i> 수업일지</a>

            </div>
            <div class="pt-6 pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-[0.2em]">Management</div>

            </div>
        </nav>

                <div class="fixed-card">
