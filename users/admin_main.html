<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더엠수학 | 원장님 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-style: normal !important; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; }

        /* 모바일 메뉴 애니메이션 */
        #mobile-menu { transition: transform 0.3s ease-in-out; }
        .menu-open { transform: translateX(0) !important; }

        /* 카드 그리드 설정 */
        .stat-card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            justify-content: start;
        }

        @media (min-width: 1024px) {
            .stat-card-grid {
                grid-template-columns: repeat(5, 180px);
                gap: 20px;
            }
        }

        /* 🎨 원장님 요청: 심플 카드 디자인 */
        .fixed-card {
            background-color: white;
            border-radius: 1.25rem;
            border: 1px solid #eef2f6;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center; /* 예시 이미지처럼 중앙 정렬 */
            justify-content: center;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            cursor: pointer;
        }

        @media (min-width: 1024px) {
            .fixed-card { width: 180px; height: 180px; padding: 25px; }
            .fixed-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05); border-color: #2563EB; }
        }
        
        /* 아이콘 색상 고정 (블루) */
        .card-icon { color: #2563EB; font-size: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen relative overflow-x-hidden">

    <header class="md:hidden bg-white border-b border-slate-100 p-4 flex items-center justify-between sticky top-0 z-[60]">
        <h1 class="text-xl font-black text-[#2563EB] flex items-center gap-2">
            더엠수학
        </h1>
        <button id="menu-toggle" class="p-2 text-slate-500">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </header>

    <aside id="mobile-menu" class="fixed md:relative inset-y-0 left-0 w-64 bg-white border-r border-slate-100 flex flex-col z-[70] -translate-x-full md:translate-x-0">
        <div class="p-6 hidden md:flex items-center justify-between">
            <h1 class="text-2xl font-black text-[#2563EB] flex items-center gap-2">
                더엠수학
            </h1>
        </div>
        
        <nav class="flex-1 flex flex-col p-4 space-y-0.5 overflow-y-auto no-scrollbar">
            <div class="pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-widest">Dashboard</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2 bg-blue-50 text-blue-700 rounded-xl font-bold text-sm mb-2">Home</a>
            
            <div class="space-y-0.5">
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-group w-5 text-center"></i> 학생현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-layer-group w-5 text-center"></i> 반현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-book-open w-5 text-center"></i> 숙제현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-star w-5 text-center"></i> 굿티커현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-check w-5 text-center"></i> 출결현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> 보강현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-600 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-bullhorn w-5 text-center"></i> 공지사항</a>
            </div>

            <div class="mt-auto pt-10 pb-4">
                <a href="../index.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-rose-500 rounded-2xl text-sm font-bold justify-center transition-colors">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </a>
            </div>
        </nav>
    </aside>

    <div id="menu-overlay" class="fixed inset-0 bg-black/50 z-[65] hidden"></div>

    <main class="flex-1 p-5 md:p-12 w-full max-w-7xl mx-auto">
        <div class="mb-10 mt-2 md:mt-0 text-center md:text-left">
            <h2 class="text-2xl md:text-4xl font-black text-slate-800 tracking-tight">
                김주호 <span class="text-base md:text-xl font-medium text-slate-400">원장님 안녕하세요! 👋</span>
            </h2>
            <p class="text-slate-400 text-sm md:text-lg mt-1 font-medium">오늘의 학원 현황을 확인하세요.</p>
        </div>

        <div class="stat-card-grid">
            <div class="fixed-card">
                <i class="fa-solid fa-user-group card-icon"></i>
                <span class="text-xl md:text-3xl font-black text-slate-800">4명</span>
                <span class="text-[11px] font-bold text-slate-400 mt-1">전체 학생 수</span>
            </div>

            <div class="fixed-card">
                <i class="fa-solid fa-graduation-cap card-icon"></i>
                <span class="text-xl md:text-3xl font-black text-slate-800">15개</span>
                <span class="text-[11px] font-bold text-slate-400 mt-1">전체 반</span>
            </div>

            <div class="fixed-card">
                <i class="fa-solid fa-circle-check card-icon"></i>
                <span class="text-xl md:text-3xl font-black text-slate-800">0명</span>
                <span class="text-[11px] font-bold text-slate-400 mt-1">숙제 완료</span>
            </div>

            <div class="fixed-card">
                <i class="fa-solid fa-circle-xmark card-icon text-rose-500"></i>
                <span class="text-xl md:text-3xl font-black text-slate-800">0명</span>
                <span class="text-[11px] font-bold text-slate-400 mt-1">숙제 미완료</span>
            </div>

            <div class="fixed-card">
                <i class="fa-solid fa-clipboard-check card-icon"></i>
                <span class="text-xl md:text-3xl font-black text-slate-800">0/4</span>
                <span class="text-[11px] font-bold text-slate-400 mt-1">오늘 출결</span>
            </div>

            <div class="fixed-card">
                <i class="fa-solid fa-calendar-day card-icon"></i>
                <span class="text-xl md:text-3xl font-black text-slate-800">2건</span>
                <span class="text-[11px] font-bold text-slate-400 mt-1">보강 예정</span>
            </div>
        </div>
    </main>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuOverlay = document.getElementById('menu-overlay');

        function toggleMenu() {
            mobileMenu.classList.toggle('menu-open');
            menuOverlay.classList.toggle('hidden');
        }

        menuToggle.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
