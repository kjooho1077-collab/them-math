<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더엠수학 | 원장님 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=NotoSansKR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-style: normal !important; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; }

        /* 모바일 메뉴 애니메이션을 위한 설정 */
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }
        .menu-open {
            transform: translateX(0) !important;
        }

        .stat-card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px;
        }

        @media (min-width: 768px) {
            .stat-card-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
        }

        @media (min-width: 1024px) {
            .stat-card-grid { grid-template-columns: repeat(5, 1fr); }
        }

        .fixed-card {
            background-color: white;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .fixed-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen relative overflow-x-hidden">

    <header class="md:hidden bg-white border-b border-slate-100 p-4 flex items-center justify-between sticky top-0 z-[60]">
        <h1 class="text-xl font-black text-emerald-600 flex items-center gap-2">
            <img src="../logo.png" alt="M" class="w-7 h-7 object-contain" onerror="this.src='https://via.placeholder.com/40?text=M'">
            더엠수학
        </h1>
        <button id="menu-toggle" class="p-2 text-slate-500 hover:text-emerald-500 transition-colors">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </header>

    <aside id="mobile-menu" class="fixed md:relative inset-y-0 left-0 w-64 bg-white border-r border-slate-100 flex flex-col z-[70] -translate-x-full md:translate-x-0">
        <div class="p-6 hidden md:flex items-center justify-between">
            <h1 class="text-2xl font-black text-emerald-600 flex items-center gap-2">
                <img src="../logo.png" alt="M" class="w-8 h-8 object-contain">
                더엠수학
            </h1>
        </div>
        
        <nav class="flex-1 flex flex-col p-4 space-y-1 overflow-y-auto">
            <div class="pb-2 text-[10px] font-bold text-slate-300 px-4 uppercase tracking-widest">Dashboard</div>
            <a href="#" class="flex items-center gap-3 px-4 py-2 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm">Home</a>
            <div class="space-y-0.5">
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-group w-5"></i> 학생현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-layer-group w-5"></i> 반현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-book-open w-5"></i> 숙제현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-star w-5"></i> 굿티커현황</a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl text-sm"><i class="fa-solid fa-user-check w-5"></i> 출결현황</a>
            </div>
            
            <div class="mt-auto p-4">
                <a href="../index.html" class="flex items-center gap-3 px-4 py-3 text-rose-500 bg-rose-50 rounded-2xl text-sm font-bold justify-center">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </a>
            </div>
        </nav>
    </aside>

    <div id="menu-overlay" class="fixed inset-0 bg-black/50 z-[65] hidden"></div>

    <main class="flex-1 p-5 md:p-12 max-w-7xl mx-auto w-full">
        <div class="mb-8">
            <h2 class="text-2xl md:text-4xl font-black text-slate-800 tracking-tight">
                김주호 <span class="text-base md:text-xl font-medium text-slate-500">원장님</span> 😄
            </h2>
            <p class="text-slate-400 text-sm md:text-lg mt-1 font-medium">관리자 대시보드입니다.</p>
        </div>

        <div class="stat-card-grid">
            <div class="fixed-card">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center mb-3"><i class="fa-solid fa-user-group text-lg"></i></div>
                <span class="text-[10px] md:text-[11px] font-bold text-slate-400">학생현황</span>
                <span class="text-xl md:text-2xl font-black text-slate-800 mt-1">4명</span>
            </div>
            <div class="fixed-card">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center mb-3"><i class="fa-solid fa-layer-group text-lg"></i></div>
                <span class="text-[10px] md:text-[11px] font-bold text-slate-400">반현황</span>
                <span class="text-xl md:text-2xl font-black text-slate-800 mt-1">15개</span>
            </div>
            <div class="fixed-card">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mb-3"><i class="fa-solid fa-book-open text-lg"></i></div>
                <span class="text-[10px] md:text-[11px] font-bold text-slate-400">숙제현황</span>
                <span class="text-xl md:text-2xl font-black text-slate-800 mt-1">3개</span>
            </div>
            <div class="fixed-card">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center mb-3"><i class="fa-solid fa-star text-lg"></i></div>
                <span class="text-[10px] md:text-[11px] font-bold text-slate-400">굿티커</span>
                <span class="text-xl md:text-2xl font-black text-slate-800 mt-1">128</span>
            </div>
        </div>
    </main>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuOverlay = document.getElementById('menu-overlay');

        // 메뉴 열기/닫기 함수
        function toggleMenu() {
            mobileMenu.classList.toggle('menu-open');
            menuOverlay.classList.toggle('hidden');
            // 메뉴 열렸을 때 본문 스크롤 막기
            document.body.style.overflow = mobileMenu.classList.contains('menu-open') ? 'hidden' : '';
        }

        menuToggle.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu); // 배경 누르면 닫기
    </script>

</body>
</html>
